name: DAST - OWASP ZAP

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  dast:
    name: DAST - OWASP ZAP API Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Autoriser Maven Wrapper
        run: chmod +x mvnw

      - name: Démarrer PostgreSQL, Redis et Azurite
        run: docker compose up -d postgres redis azurite

      - name: Démarrer le backend local
        shell: bash
        run: |
          export SPRING_DOCKER_COMPOSE_ENABLED=false
          nohup ./mvnw --batch-mode spring-boot:run > backend-dast.log 2>&1 &
          echo $! > backend-dast.pid

      - name: Attendre que l'API soit disponible
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend disponible."
              exit 0
            fi
            sleep 2
          done

          echo "Le backend n'est pas devenu disponible dans le délai imparti."
          tail -n 200 backend-dast.log || true
          docker compose ps || true
          exit 1

      - name: Scanner l'API avec OWASP ZAP
        id: zap
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p zap-reports
          sudo chown 1000:1000 zap-reports
          chmod 700 zap-reports

          docker run --rm \
            --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py \
              -t http://127.0.0.1:8080/v3/api-docs \
              -f openapi \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-report.md

      - name: Publier le résultat DAST dans le Job Summary
        if: always()
        shell: bash
        env:
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        run: |
          {
            echo "## DAST — OWASP ZAP"
            echo
            echo "**Cible :** instance locale éphémère du backend"
            echo
            echo "**API :** OpenAPI /v3/api-docs"
            echo
            echo "**Politique :** informative — les alertes DAST sont revues avant de devenir bloquantes."
            echo
            echo "**Résultat du scanner :** \`$ZAP_OUTCOME\`"
            echo

            if [ -s zap-reports/zap-report.md ]; then
              sed -n '1,250p' zap-reports/zap-report.md
            else
              echo "Aucun rapport Markdown ZAP n'a été généré."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Arrêter l'environnement local
        if: always()
        shell: bash
        run: |
          if [ -f backend-dast.pid ]; then
            kill "$(cat backend-dast.pid)" 2>/dev/null || true
          fi
          docker compose down -v
