name: SCA - Dependency Security

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca-trivy:
    name: SCA - Trivy Maven Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Scanner les dépendances avec Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-sca.txt
          exit-code: 1

      - name: Publier le résultat dans le Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCA — Trivy"
            echo
            echo "**Périmètre :** dépendances Maven actuelles"
            echo
            echo "**Seuil bloquant :** HIGH / CRITICAL avec correctif disponible"
            echo

            if [ -s trivy-sca.txt ]; then
              echo '```text'
              sed -n '1,200p' trivy-sca.txt
              echo '```'
            else
              echo "Aucune vulnérabilité HIGH ou CRITICAL détectée."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-trivy-report
          path: trivy-sca.txt
          if-no-files-found: warn

      - name: Bloquer si des CVE critiques sont détectées
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "Des vulnérabilités HIGH ou CRITICAL corrigibles ont été détectées."
          exit 1

  dependency-review:
    name: Dependency Review - PR changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Vérifier les dépendances introduites par la PR
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
